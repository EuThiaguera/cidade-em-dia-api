spring.application.name=cidade-em-dia
server.port=${PORT:8080}

# ---------- Banco Oracle da FIAP ----------
# Usuário e senha NUNCA ficam no código: vêm das variáveis de ambiente DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno: o Oracle da FIAP limita o número de sessões por aluno
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# ---------- Respostas de erro ----------
# Nunca devolver stack trace nem mensagem interna para o cliente
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# Datas no JSON no formato ISO (2026-11-10T14:30:00)
spring.jackson.serialization.write-dates-as-timestamps=false

# Origens liberadas no CORS (separe por vírgula). * = qualquer origem
app.cors.origens=${CORS_ORIGINS:*}
